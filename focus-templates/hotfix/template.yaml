id: hotfix
name: 핫픽스
description: 한두 가지 버그 수정이나 간단한 기능 추가를 빠르게 처리하기 위한 축약형 템플릿
stages:
    - id: plan
      kind: plan
      label: 문제 파악
      instructions: 수정할 버그나 추가할 간단한 기능을 한두 문장으로 명확히 정의한다. 재현 방법, 원인 추정 위치(파일/함수), 예상 변경 범위를 짧게 정리한다. 범위가 커지면 즉시 사용자에게 알리고 범위를 좁힌다.
      fix_instructions: ""
    - id: build
      kind: build
      label: 빠른 수정
      instructions: 계획에서 정의한 범위 내에서만 최소한의 코드 변경을 수행한다. 불필요한 리팩터링이나 관련 없는 파일 수정을 피한다. 변경 후 간단한 동작 확인(빌드, 린트, 관련 테스트 실행 또는 수동 재현)으로 문제가 해결됐는지 바로 검증한다.
      fix_instructions: 검증에서 실패한 부분만 다시 확인하고 최소 범위로 재수정한다. 새로운 이슈가 발견되면 범위를 넓히지 말고 별도로 기록한다.
    - id: pr
      kind: pr
      label: PR 생성
      instructions: 변경 사항을 요약해 짧고 명확한 제목과 설명으로 PR을 생성한다. 어떤 버그/기능을 고쳤는지, 어떻게 확인했는지 핵심만 적는다.
      fix_instructions: ""
    - id: merge
      kind: merge
      label: 머지
      instructions: CI 또는 간단한 재검증이 통과하면 바로 머지한다. 추가 승인 절차 없이 빠르게 반영하는 것을 목표로 한다.
      fix_instructions: ""
