id: pc_maintenance
name: 내 컴퓨터 관리
description: 디스크 용량, 불필요한 프로세스, 보안 점검을 포함한 PC 점검 및 정리 파이프라인
stages:
    - id: plan
      kind: plan
      label: 점검 계획 수립
      instructions: 사용자의 OS와 환경을 확인하고, 디스크 용량 점검, 불필요한 프로세스 정리, 보안 점검의 범위와 순서를 정한다. 각 단계에서 실행할 명령어 종류(디스크 사용량 조회, 프로세스 목록 조회, 보안 설정 확인 등)를 미리 계획하고, 위험하거나 시스템에 영향을 줄 수 있는 작업은 먼저 보고 후 승인받도록 안내한다.
      fix_instructions: 계획이 특정 OS에 맞지 않거나 범위가 모호하면, 실제 운영체제와 사용 가능한 도구를 재확인하여 계획을 구체화한다.
    - id: disk_usage
      kind: build
      label: 디스크 용량 점검
      instructions: 전체 디스크 및 주요 디렉터리의 용량 사용 현황을 조회한다. 용량을 많이 차지하는 폴더/파일, 임시 파일, 캐시, 로그 파일, 다운로드 폴더의 오래된 파일 등을 식별하여 목록화한다. 삭제가 필요해 보이는 항목은 삭제 전 반드시 사용자 확인을 받도록 표시하고, 바로 삭제하지 않는다.
      fix_instructions: 용량 조회 명령이 실패하거나 권한 문제가 발생하면 사용 가능한 대체 명령으로 재시도하고, 결과가 불완전하면 누락된 디렉터리를 추가로 조회한다.
    - id: process_check
      kind: build
      label: 불필요한 프로세스 점검
      instructions: 현재 실행 중인 프로세스 목록을 조회하여 CPU/메모리 사용량이 높은 프로세스, 중복 실행 중인 프로세스, 사용자가 의도적으로 실행하지 않은 백그라운드 프로세스를 식별한다. 각 프로세스의 역할을 설명하고 종료해도 안전한지 평가하되, 실제 종료는 사용자 승인 후에만 수행한다.
      fix_instructions: 프로세스 식별 결과가 불확실하거나 알 수 없는 프로세스가 있으면, 해당 프로세스명을 추가 조사하고 판단 근거를 명확히 보완한다.
    - id: security_check
      kind: build
      label: 보안 점검
      instructions: 방화벽 상태, OS 및 주요 소프트웨어 업데이트 여부, 로그인 계정 및 비밀번호 정책, 원격 접속 설정, 설치된 의심스러운 프로그램 등을 점검한다. 발견된 취약점이나 위험 요소를 심각도별로 정리하고 구체적인 개선 방법을 제시한다.
      fix_instructions: 점검 항목이 누락되었거나 결과가 OS 특성과 맞지 않으면, 해당 OS의 표준 보안 점검 항목을 다시 확인하여 보완한다.
    - id: review
      kind: review
      label: 결과 요약 및 권고
      instructions: 디스크 용량, 프로세스, 보안 점검 결과를 종합하여 핵심 문제와 우선순위가 높은 조치 항목을 요약한다. 각 조치에 대해 예상 효과와 위험도를 함께 제시하고, 사용자가 바로 실행할 수 있는 다음 단계 체크리스트를 작성한다.
      fix_instructions: 요약이 앞 단계의 세부 결과와 일치하지 않거나 중요한 항목이 빠졌으면, 해당 단계의 원본 결과를 다시 확인하여 요약을 보완한다.
