name: registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Script tests
        run: python -m unittest scripts/test_registry.py
      - name: registry.json matches the repository
        run: python scripts/registry.py check
